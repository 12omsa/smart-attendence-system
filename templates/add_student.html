<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

</head>

<body>

    <h1>Add Student</h1>

    <form method="POST">

        <label>
            Student ID
        </label>

        <br>

        <input
            type="text"
            name="student_id"
            placeholder="Example: ST003"
            required
        >

        <br><br>


        <label>
            Student Name
        </label>

        <br>

        <input
            type="text"
            name="name"
            placeholder="Example: John Doe"
            required
        >

        <br><br>


        <button type="submit">
            Add Student
        </button>

    </form>

    <br>

    <a href="/students">
        ← Back to Students
    </a>

</body>

</html>
